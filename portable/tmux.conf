if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal tmux-256color' 'set -g default-terminal screen-256color'
set -ga terminal-overrides ',xterm:colors=256,putty*:colors=256'
set -gq extended-keys on
set -sg escape-time 30
set -g focus-events on
set -g mouse on
set -g history-limit 10000
set -g set-clipboard on
set -g set-titles on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
set -g display-time 2000

set -g prefix None
set -g prefix2 None
unbind C-b

set -g @hx_layout '[ "$N" = floating ] && exit 0; if [ -n "$NEW" ]; then W=$(tmux new-window -P -F "#{window_id}" -c "$D"); P=$(tmux display -p -t "$W" "#{pane_id}"); fi; V=$(command -v vim || echo vi); tmux split-window -d -v -p 20 -t "$P" -c "$D"; S=$(tmux split-window -d -hbf -p 15 -t "$P" -c "$D" -P -F "#{pane_id}" "$V -c HxTree"); tmux set -w -t "$W" @main "$P"; tmux set -w -t "$W" @sidebar "$S"; tmux select-pane -t "$P"'
set -g @hx_sidebar 'S=$(tmux show -wqv -t "$W" @sidebar); if [ -n "$S" ] && tmux list-panes -t "$W" -F "#{pane_id}" | grep -qx -- "$S"; then tmux kill-pane -t "$S"; else V=$(command -v vim || echo vi); S=$(tmux split-window -hbf -p 15 -t "$P" -c "$D" -P -F "#{pane_id}" "$V -c HxTree"); tmux set -w -t "$W" @sidebar "$S"; fi'
set -g @hx_float 'if [ "$N" = floating ]; then tmux detach-client -t "$C"; else tmux display-popup -c "$C" -E -w 80% -h 80% -d "$D" "env -u TMUX tmux -S $S new-session -A -s floating"; fi'
set -g @hx_config 'tmux display-popup -c "$C" -E -w 90% -h 90% "vim ~/.tmux.conf && tmux source-file ~/.tmux.conf" 2>/dev/null || tmux new-window "vim ~/.tmux.conf && tmux source-file ~/.tmux.conf"'

set-hook -g session-created 'run-shell "N=\"#{session_name}\" W=\"#{window_id}\" P=\"#{pane_id}\" D=\"#{pane_current_path}\"; #{@hx_layout}"'

if-shell 'tmux -V | awk "{v=\$2+0; exit !(v >= 2.9)}"' 'set -g status 2'
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=#a0a6af"
set -g status-justify left
set -g status-left ""
set -g status-left-length 0
set -g status-right-length 120
set -g status-right "#[fg=#00ff88,bold] vim#[fg=#00ff88,bold]❯#(basename \"\$SHELL\") #[fg=#6c7086,bold]• #[fg=#ffffff]#S #[fg=#6c7086,bold]• #[fg=#ff6600]load #(cut -d' ' -f1 /proc/loadavg) #[fg=#6c7086,bold]• #[fg=#ff6600]ram #(free -h | awk '/^Mem/ {print \$3 \"/\" \$2}') #[fg=#6c7086,bold]• #[fg=#00ccff,bold]#H "
setw -g window-status-separator ""
setw -g window-status-format "#{?window_bell_flag,#[fg=#ff0088 bold],#[fg=#a0a6af]} [#I #W] #{?window_zoomed_flag,[] ,}#{?pane_synchronized,<> ,}"
setw -g window-status-current-format "#[fg=#ff6600 bold] [#I #W] #{?window_zoomed_flag,[] ,}#{?pane_synchronized,<> ,}"
set -g message-style "fg=#ff6600,bold"
set -g message-command-style "fg=#ff6600,bold"
setw -g mode-style "bg=#444155"

set -g pane-border-status top
set -gq pane-border-lines single
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=green"
set -g pane-border-format "#{?pane_active,#[fg=green bold],#[fg=brightblack]} #{?#{==:#{pane_id},#{@sidebar}},explorer,#{?#{==:#{pane_id},#{@main}},main,#{pane_current_command}}} "
set -gq popup-border-lines rounded
set -gq popup-border-style "fg=green"

set -g @hint_root "#[fg=#ef7a73]C-p #[fg=#a0a6af]pane  #[fg=#ef7a73]C-n #[fg=#a0a6af]resize  #[fg=#ef7a73]C-A-t #[fg=#a0a6af]tab  #[fg=#ef7a73]C-A-s #[fg=#a0a6af]scroll  #[fg=#ef7a73]C-A-o #[fg=#a0a6af]sess.  #[fg=#ef7a73]C-A-g #[fg=#a0a6af]lock #[fg=#555b66]| #[fg=#ef7a73]A-hjkl #[fg=#a0a6af]focus  #[fg=#ef7a73]C-A-hl/jk #[fg=#a0a6af]move  #[fg=#ef7a73]A-m #[fg=#a0a6af]new  #[fg=#ef7a73]A-f #[fg=#a0a6af]float  #[fg=#ef7a73]A-S-f #[fg=#a0a6af]full  #[fg=#ef7a73]A-S-t #[fg=#a0a6af]new tab  #[fg=#ef7a73]A-S-w #[fg=#a0a6af]close tab  #[fg=#ef7a73]A-S-h #[fg=#a0a6af]explorer  #[fg=#ef7a73]A-S-k #[fg=#a0a6af]config  #[fg=#ef7a73]A-S-b #[fg=#a0a6af]hints"
set -g @hint_pane " #[fg=#ef7a73,bold]PANE #[fg=#555b66]| #[fg=#ef7a73]hjkl #[fg=#a0a6af]focus  #[fg=#ef7a73]p #[fg=#a0a6af]next  #[fg=#ef7a73]n #[fg=#a0a6af]new  #[fg=#ef7a73]d #[fg=#a0a6af]down  #[fg=#ef7a73]r #[fg=#a0a6af]right  #[fg=#ef7a73]x #[fg=#a0a6af]close  #[fg=#ef7a73]f #[fg=#a0a6af]full  #[fg=#ef7a73]w #[fg=#a0a6af]float  #[fg=#ef7a73]z #[fg=#a0a6af]frames  #[fg=#ef7a73]c #[fg=#a0a6af]rename  #[fg=#ef7a73][] #[fg=#a0a6af]layout  #[fg=#ef7a73]Esc #[fg=#a0a6af]normal"
set -g @hint_resize " #[fg=#ef7a73,bold]RESIZE #[fg=#555b66]| #[fg=#ef7a73]hjkl #[fg=#a0a6af]grow  #[fg=#ef7a73]HJKL #[fg=#a0a6af]shrink  #[fg=#ef7a73]Esc #[fg=#a0a6af]normal"
set -g @hint_tab " #[fg=#ef7a73,bold]TAB #[fg=#555b66]| #[fg=#ef7a73]hl #[fg=#a0a6af]prev/next  #[fg=#ef7a73]1-9 #[fg=#a0a6af]go  #[fg=#ef7a73]n #[fg=#a0a6af]new  #[fg=#ef7a73]x #[fg=#a0a6af]close  #[fg=#ef7a73]r #[fg=#a0a6af]rename  #[fg=#ef7a73]s #[fg=#a0a6af]sync  #[fg=#ef7a73]b #[fg=#a0a6af]break pane  #[fg=#ef7a73]Tab #[fg=#a0a6af]last  #[fg=#ef7a73]Esc #[fg=#a0a6af]normal"
set -g @hint_scroll " #[fg=#ef7a73,bold]SCROLL #[fg=#555b66]| #[fg=#ef7a73]jk #[fg=#a0a6af]scroll  #[fg=#ef7a73]hl #[fg=#a0a6af]page  #[fg=#ef7a73]du #[fg=#a0a6af]half page  #[fg=#ef7a73]s #[fg=#a0a6af]search  #[fg=#ef7a73]np #[fg=#a0a6af]next/prev  #[fg=#ef7a73]v #[fg=#a0a6af]select  #[fg=#ef7a73]x #[fg=#a0a6af]line  #[fg=#ef7a73]y #[fg=#a0a6af]copy  #[fg=#ef7a73]e #[fg=#a0a6af]edit  #[fg=#ef7a73]Esc #[fg=#a0a6af]normal"
set -g @hint_session " #[fg=#ef7a73,bold]SESSION #[fg=#555b66]| #[fg=#ef7a73]d #[fg=#a0a6af]detach  #[fg=#ef7a73]w #[fg=#a0a6af]manager  #[fg=#ef7a73]c #[fg=#a0a6af]config  #[fg=#ef7a73]Esc #[fg=#a0a6af]normal"
set -g @hint_locked " #[fg=#ef7a73,bold]LOCKED #[fg=#555b66]| #[fg=#ef7a73]C-A-g #[fg=#a0a6af]unlock"
set -gq status-format[1] "#[align=left]#{?pane_in_mode,#{E:@hint_scroll},#{?#{==:#{client_key_table},pane},#{E:@hint_pane},#{?#{==:#{client_key_table},resize},#{E:@hint_resize},#{?#{==:#{client_key_table},tab},#{E:@hint_tab},#{?#{==:#{client_key_table},session},#{E:@hint_session},#{?#{==:#{client_key_table},locked},#{E:@hint_locked},#{E:@hint_root}}}}}}}"

bind -n M-h if -F '#{pane_at_left}' 'previous-window' 'select-pane -L'
bind -n M-Left if -F '#{pane_at_left}' 'previous-window' 'select-pane -L'
bind -n M-l if -F '#{pane_at_right}' 'next-window' 'select-pane -R'
bind -n M-Right if -F '#{pane_at_right}' 'next-window' 'select-pane -R'
bind -n M-j select-pane -D
bind -n M-Down select-pane -D
bind -n M-k select-pane -U
bind -n M-Up select-pane -U
bind -n M-1 select-window -t :=1
bind -n M-2 select-window -t :=2
bind -n M-3 select-window -t :=3
bind -n M-4 select-window -t :=4
bind -n M-5 select-window -t :=5
bind -n M-6 select-window -t :=6
bind -n M-7 select-window -t :=7
bind -n M-8 select-window -t :=8
bind -n M-9 select-window -t :=9
bind -n M-m split-window -h -c "#{pane_current_path}"
bind -n M-f run-shell 'N="#{session_name}" C="#{client_name}" D="#{pane_current_path}" S="#{socket_path}"; #{@hx_float}'
bind -n M-T run-shell 'NEW=1 N="#{session_name}" D="#{pane_current_path}"; #{@hx_layout}'
bind -n M-W kill-window
bind -n M-F resize-pane -Z
bind -n M-B if -F '#{==:#{status},2}' 'set status on' 'set status 2'
bind -n M-H run-shell 'W="#{window_id}" P="#{pane_id}" D="#{pane_current_path}"; #{@hx_sidebar}'
bind -n M-K run-shell 'C="#{client_name}"; #{@hx_config}'
bind -n C-q confirm-before -p "quit session #S? (y/n)" kill-session
bind -n C-M-h swap-window -d -t -1
bind -n C-M-l swap-window -d -t +1
bind -n C-M-j swap-pane -D
bind -n C-M-k swap-pane -U
bind -n C-M-g set key-table locked \; refresh-client -S
bind -n C-p switch-client -T pane \; refresh-client -S
bind -n C-n switch-client -T resize \; refresh-client -S
bind -n C-M-t switch-client -T tab \; refresh-client -S
bind -n C-M-o switch-client -T session \; refresh-client -S
bind -n C-M-s copy-mode

bind -T locked C-M-g set key-table root \; refresh-client -S

bind -T pane h select-pane -L \; switch-client -T pane
bind -T pane Left select-pane -L \; switch-client -T pane
bind -T pane j select-pane -D \; switch-client -T pane
bind -T pane Down select-pane -D \; switch-client -T pane
bind -T pane k select-pane -U \; switch-client -T pane
bind -T pane Up select-pane -U \; switch-client -T pane
bind -T pane l select-pane -R \; switch-client -T pane
bind -T pane Right select-pane -R \; switch-client -T pane
bind -T pane p select-pane -t :.+ \; switch-client -T pane
bind -T pane [ previous-layout \; switch-client -T pane
bind -T pane ] next-layout \; switch-client -T pane
bind -T pane n split-window -h -c "#{pane_current_path}"
bind -T pane d split-window -v -c "#{pane_current_path}"
bind -T pane r split-window -h -c "#{pane_current_path}"
bind -T pane s split-window -v -c "#{pane_current_path}"
bind -T pane x kill-pane
bind -T pane f resize-pane -Z
bind -T pane w run-shell 'N="#{session_name}" C="#{client_name}" D="#{pane_current_path}" S="#{socket_path}"; #{@hx_float}'
bind -T pane z if -F '#{==:#{pane-border-status},off}' 'set pane-border-status top' 'set pane-border-status off'
bind -T pane c command-prompt -p "pane name:" "select-pane -T '%%'"
bind -T pane Escape refresh-client -S
bind -T pane Enter refresh-client -S
bind -T pane C-p refresh-client -S

bind -T resize h resize-pane -L 4 \; switch-client -T resize
bind -T resize Left resize-pane -L 4 \; switch-client -T resize
bind -T resize j resize-pane -D 2 \; switch-client -T resize
bind -T resize Down resize-pane -D 2 \; switch-client -T resize
bind -T resize k resize-pane -U 2 \; switch-client -T resize
bind -T resize Up resize-pane -U 2 \; switch-client -T resize
bind -T resize l resize-pane -R 4 \; switch-client -T resize
bind -T resize Right resize-pane -R 4 \; switch-client -T resize
bind -T resize H resize-pane -R 4 \; switch-client -T resize
bind -T resize J resize-pane -U 2 \; switch-client -T resize
bind -T resize K resize-pane -D 2 \; switch-client -T resize
bind -T resize L resize-pane -L 4 \; switch-client -T resize
bind -T resize Escape refresh-client -S
bind -T resize Enter refresh-client -S
bind -T resize C-n refresh-client -S

bind -T tab h previous-window \; switch-client -T tab
bind -T tab Left previous-window \; switch-client -T tab
bind -T tab k previous-window \; switch-client -T tab
bind -T tab Up previous-window \; switch-client -T tab
bind -T tab l next-window \; switch-client -T tab
bind -T tab Right next-window \; switch-client -T tab
bind -T tab j next-window \; switch-client -T tab
bind -T tab Down next-window \; switch-client -T tab
bind -T tab n run-shell 'NEW=1 N="#{session_name}" D="#{pane_current_path}"; #{@hx_layout}'
bind -T tab x kill-window
bind -T tab r command-prompt -I "#W" "rename-window '%%'"
bind -T tab s setw synchronize-panes
bind -T tab b break-pane
bind -T tab Tab last-window
bind -T tab 1 select-window -t :=1
bind -T tab 2 select-window -t :=2
bind -T tab 3 select-window -t :=3
bind -T tab 4 select-window -t :=4
bind -T tab 5 select-window -t :=5
bind -T tab 6 select-window -t :=6
bind -T tab 7 select-window -t :=7
bind -T tab 8 select-window -t :=8
bind -T tab 9 select-window -t :=9
bind -T tab Escape refresh-client -S
bind -T tab Enter refresh-client -S
bind -T tab C-M-t refresh-client -S

bind -T session d detach-client
bind -T session w choose-tree -s
bind -T session c run-shell 'C="#{client_name}"; #{@hx_config}'
bind -T session Escape refresh-client -S
bind -T session Enter refresh-client -S
bind -T session C-M-o refresh-client -S

bind -T copy-mode-vi h send -X page-up
bind -T copy-mode-vi Left send -X page-up
bind -T copy-mode-vi l send -X page-down
bind -T copy-mode-vi Right send -X page-down
bind -T copy-mode-vi d send -X halfpage-down
bind -T copy-mode-vi u send -X halfpage-up
bind -T copy-mode-vi s command-prompt -p "(search)" "send -X search-backward '%%'"
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi p send -X search-reverse
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi x send -X select-line
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-c send -X cancel
bind -T copy-mode-vi C-M-s send -X cancel
bind -T copy-mode-vi Escape if -F '#{selection_present}' 'send -X clear-selection' 'send -X cancel'
bind -T copy-mode-vi e send -X cancel \; capture-pane -J -S - \; save-buffer "/tmp/tmux-scrollback-$USER" \; delete-buffer \; new-window "vim + /tmp/tmux-scrollback-$USER"
